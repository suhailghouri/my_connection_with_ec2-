

on:
  workflow_dispatch:

jobs:
  ssh-test:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH connection
        env:
          EC2_HOST: "32.236.201.74"
          EC2_USER: "deploy"
          EC2_PRIVATE_KEY: "github_actions_deploy"
        run: |
          set -eu
- name: Check SSH key secret
  env:
    KEY: ${{ secrets.EC2_SSH_KEY }}
  run: |
    test -n "$KEY" && echo "secret is set" || echo "secret is EMPTY"
    echo "$KEY" | head -1
    echo "$KEY" | tail -1
    echo "$KEY" > k && chmod 600 k && ssh-keygen -y -f k > /dev/null && echo "key parses OK"
    
name: Test SSH Connectivity to EC2
          test -n "$EC2_HOST" || {
            echo "EC2_HOST secret is missing"
            exit 1
          }

          test -n "$EC2_USER" || {
            echo "EC2_USER secret is missing"
            exit 1
          }

          test -n "$EC2_PRIVATE_KEY" || {
            echo "EC2_SSH_PRIVATE_KEY secret is missing"
            exit 1
          }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_PRIVATE_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" \
            'echo "SSH connection successful"; whoami; hostname'
