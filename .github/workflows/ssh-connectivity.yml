
name: Test SSH Connectivity to EC2

on:
  workflow_dispatch:

jobs:
  ssh-test:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH connection
        env:
          EC2_HOST: "32.236.201.74"
          EC2_USER: "deploy"
          EC2_PRIVATE_KEY: "secrets.EC2_deploy"
        run: |
          set -eu

          test -n "$EC2_HOST" || {
            echo "EC2_HOST secret is missing"
            exit 1
          }

          test -n "$EC2_USER" || {
            echo "EC2_USER secret is missing"
            exit 1
          }

          test -n "$EC2_PRIVATE_KEY" || {
            echo "EC2_SSH_PRIVATE_KEY secret is missing"
            exit 1
          }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_PRIVATE_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" \
            'echo "SSH connection successful"; whoami; hostname'
